repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
        # TypeScript config files allow comments.
        exclude: "tsconfig.*\\.json"
      - id: check-toml
      - id: check-xml
      - id: end-of-file-fixer
        exclude: "pnpm-lock\\.yaml|^\\.idea/"
      - id: trailing-whitespace
        exclude: "pnpm-lock\\.yaml|^\\.idea/"
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["--strict"]
        types: [yaml]
        exclude: "^(node_modules/|\\.llm/|\\.claude/|\\.remember/|\\.serena/|\\.playwright-mcp/|dist/|coverage/|storybook-static/|pnpm-lock\\.yaml)"

  - repo: local
    hooks:
      - id: check-mise-runtimes
        name: check mise runtimes
        entry: scripts/check-mise-runtimes.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: just-fmt
        name: just --fmt
        entry: sh -c 'for file do just --fmt --justfile "$file" || exit; done' --
        language: system
        files: '(?i)(^|/)\.?justfile$|\.just$'
        types: [file]
      - id: fallow
        name: fallow
        entry: pnpm run fallow --base HEAD
        language: system
        pass_filenames: false
        types: [file]
      - id: oxfmt
        name: vp fmt
        entry: pnpm exec vp fmt --no-error-on-unmatched-pattern
        language: system
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: pnpm exec vp exec markdownlint-cli2
        language: system
        types: [markdown]
        exclude: "^(node_modules/|\\.llm/|\\.claude/|\\.remember/|\\.serena/|\\.playwright-mcp/|dist/|coverage/|storybook-static/|CLAUDE\\.md|AGENTS\\.md)"
