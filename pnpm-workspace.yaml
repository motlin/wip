packages:
  - "packages/*"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  protobufjs: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.4
  vite-plus: 1.1.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
